<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>

    <linearGradient id="metallicBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="75%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="vividBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Curved path for text -->
    <path id="archPath" d="M 120 120 A 320 180 0 0 1 680 120" fill="none" />
  </defs>

  <!-- World Map Background Grid Dot Pattern -->
  <g opacity="0.25">
    <path d="M 150 70 Q 250 40 400 60 T 650 70 Q 720 120 680 160 Q 600 180 500 150 Q 300 200 200 160 Z" fill="#3B82F6" opacity="0.4" />
    <path d="M 220 140 Q 280 100 360 110 T 480 120 Q 520 160 460 180 Z" fill="#1D4ED8" opacity="0.5" />
    <!-- Global Grid lines -->
    <ellipse cx="400" cy="120" rx="280" ry="80" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" />
    <ellipse cx="400" cy="120" rx="200" ry="50" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="400" y1="30" x2="400" y2="210" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Curved Top Text: SKY ARIANA & BALAM BAR BARAN -->
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="3">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      SKY ARIANA &amp; BALAM BAR BARAN
    </textPath>
  </text>

  <!-- Central "SKY" Text Banner -->
  <g transform="translate(0, 10)" filter="url(#dropShadow)">
    <!-- Main SKY Letters with metallic blue gradient & silver stroke -->
    <text x="400" y="240" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="130" text-anchor="middle" fill="url(#metallicBlue)" stroke="url(#silverGrad)" stroke-width="4" letter-spacing="6">
      SKY
    </text>

    <!-- Chevron Overlay in 'K' -->
    <path d="M 410 155 L 470 215 L 435 215 L 390 170 Z" fill="url(#vividBlue)" />
    <path d="M 435 215 L 490 270 L 450 270 L 410 230 Z" fill="#00D2FF" />
  </g>

  <!-- Ocean Waves & Highway Lines (Bottom Accent) -->
  <g transform="translate(0, 360)">
    <path d="M 50 40 Q 200 10 400 35 T 750 20 L 750 90 L 50 90 Z" fill="url(#skyBlueGrad)" opacity="0.85" />
    <path d="M 50 60 Q 250 35 450 50 T 750 40 L 750 100 L 50 100 Z" fill="#0B2545" />
    <path d="M 70 45 Q 220 25 380 40 T 730 30" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" />
  </g>

  <!-- Left: Cargo Vessel / Ship Icon Graphic -->
  <g transform="translate(80, 230)" filter="url(#dropShadow)">
    <!-- Ship Hull -->
    <path d="M 20 100 L 40 160 Q 150 180 230 150 L 250 90 L 30 90 Z" fill="#0F172A" stroke="url(#silverGrad)" stroke-width="2" />
    <!-- Ship Superstructure & Containers -->
    <rect x="50" y="65" width="40" height="25" fill="#1E3A8A" rx="2" stroke="#FFFFFF" stroke-width="1" />
    <rect x="95" y="60" width="35" height="30" fill="#2563EB" rx="2" stroke="#FFFFFF" stroke-width="1" />
    <rect x="135" y="65" width="40" height="25" fill="#0284C7" rx="2" stroke="#FFFFFF" stroke-width="1" />
    <!-- Command Bridge & Tower -->
    <path d="M 45 40 L 75 40 L 75 65 L 45 65 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
    <polygon points="35,40 50,20 60,20 70,40" fill="#1E293B" />
    <!-- Anchor Icon -->
    <circle cx="90" cy="120" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="90" y1="110" x2="90" y2="135" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="80" y1="120" x2="100" y2="120" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Right: Logistics Cargo Truck Graphic -->
  <g transform="translate(480, 240)" filter="url(#dropShadow)">
    <!-- Cargo Trailer Body -->
    <rect x="20" y="30" width="170" height="110" fill="#1D4ED8" rx="6" stroke="url(#silverGrad)" stroke-width="2.5" />
    <line x1="20" y1="65" x2="190" y2="65" stroke="#60A5FA" stroke-width="2" />
    <!-- Truck Cabin -->
    <path d="M 190 60 L 230 65 L 250 100 L 250 140 L 190 140 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
    <!-- Windshield -->
    <path d="M 200 70 L 225 73 L 238 95 L 200 95 Z" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5" />
    <!-- Wheels -->
    <circle cx="60" cy="142" r="16" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
    <circle cx="60" cy="142" r="6" fill="#FFFFFF" />
    <circle cx="100" cy="142" r="16" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
    <circle cx="100" cy="142" r="6" fill="#FFFFFF" />
    <circle cx="140" cy="142" r="16" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
    <circle cx="140" cy="142" r="6" fill="#FFFFFF" />
    <circle cx="215" cy="142" r="16" fill="#0F172A" stroke="#94A3B8" stroke-width="3" />
    <circle cx="215" cy="142" r="6" fill="#FFFFFF" />
  </g>

  <!-- Center Emblem Badge: Circular "BBB" (Balam Bar Baran) -->
  <g transform="translate(400, 310)" filter="url(#dropShadow)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="62" fill="url(#silverGrad)" stroke="#0F172A" stroke-width="3" />
    <circle cx="0" cy="0" r="54" fill="#0B2545" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" />
    <!-- BBB Text -->
    <text x="0" y="16" font-family="'Arial Black', sans-serif" font-weight="900" font-size="44" text-anchor="middle" fill="#FFFFFF" letter-spacing="-1">
      BBB
    </text>
    <!-- Wings Accent -->
    <path d="M -90 -10 Q -60 -25 -45 -5 Q -60 10 -90 -10 Z" fill="url(#metallicBlue)" stroke="url(#silverGrad)" stroke-width="1.5" />
    <path d="M 90 -10 Q 60 -25 45 -5 Q 60 10 90 -10 Z" fill="url(#metallicBlue)" stroke="url(#silverGrad)" stroke-width="1.5" />
  </g>
</svg>
