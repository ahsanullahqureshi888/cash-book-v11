name: Node.js CI

on:
  push:
    branches: [ "main", "ahsanullahqureshi888-restore-backup-data" ]
  pull_request:
    branches: [ "main", "ahsanullahqureshi888-restore-backup-data" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run build
    - run: npm test
